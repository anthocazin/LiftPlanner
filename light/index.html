:root {

button, .btn, select, input { font: inherit; font-size: 16px; }
button, .btn {

}
button:disabled { opacity: .35; }
button.primary, .btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; }
button.danger { color: var(--fail); }
.big { min-height: 54px; font-size: 17px; font-weight: 700; flex: 1; }
.wide { width: 100%; }
select, input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; color: var(--ink); max-width: 100%; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.note.warn { background: #fff6e0; border: 1px solid #f0d48a; border-radius: 8px; padding: 8px 10px; }

.lt-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--navy); color: #fff; }
.lt-brand b { font-size: 18px; }
.lt-brand span { margin-left: 6px; background: var(--orange); color: #fff; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 13px; }
#lt-status { flex: 1; display: flex; justify-content: flex-end; }
.lt-act { position: relative; }
.lt-act summary { list-style: none; cursor: pointer; font-size: 22px; padding: 2px 8px; border-radius: 8px; }
.lt-act summary::-webkit-details-marker { display: none; }
.lt-menu { position: absolute; right: 0; top: 40px; display: flex; flex-direction: column; gap: 6px; background: #fff; padding: 8px; border-radius: 12px; box-shadow: 0 10px 30px #0005; min-width: 170px; }
.lt-menu button, .lt-menu .btn { justify-content: flex-start; }
.lt-pill { min-height: 32px; padding: 3px 12px; border-radius: 99px; font-weight: 700; font-size: 14px; border: 0; }
.lt-pill.ok { background: var(--ok); color: #fff; }
.lt-pill.warn { background: var(--warn); color: #fff; }
.lt-pill.fail { background: var(--fail); color: #fff; }
.lt-pill.muted { background: #ffffff22; color: #fff; }
.lt-pill small { font-weight: 500; }

.lt-steps { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 50px; z-index: 9; }
.lt-steps button { min-height: 36px; padding: 4px 12px; border-radius: 99px; font-size: 14px; border-color: transparent; background: var(--bg); }
.lt-steps button.on { background: var(--navy); color: #fff; font-weight: 700; }

main#lt-main { max-width: 860px; margin: 0 auto; padding: 10px 10px 90px; }
.lt-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.lt-card h2 { margin: 0 0 10px; font-size: 17px; }
.lt-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.lt-n b { min-width: 28px; text-align: center; font-size: 18px; }
.lt-n button { width: 44px; font-size: 20px; }
.lt-chips .chip { min-width: 44px; border-radius: 99px; font-weight: 700; }
.chip.set { border-color: var(--fail); color: var(--fail); }
.chip.on { background: var(--fail); color: #fff; border-color: var(--fail); }

.lt-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; }
.lt-thumb { flex-direction: column; padding: 4px; min-width: 86px; gap: 2px; font-size: 12px; }
.lt-thumb img { width: 76px; height: 56px; object-fit: cover; border-radius: 6px; }
.lt-thumb.on { border: 2px solid var(--orange); }

.lt-photo { position: relative; width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
.lt-photo img { display: block; width: 100%; height: auto; pointer-events: none; }
.lt-ov { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.lt-drag { cursor: grab; }

.lt-f { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; position: relative; }
.lt-f > span { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.lt-f input { width: 100%; padding-right: 34px; font-size: 17px; }
.lt-f i { position: absolute; right: 12px; top: 33px; font-style: normal; color: var(--muted); pointer-events: none; }
.lt-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.lt-asm { display: flex; flex-direction: column; gap: 6px; }
.lt-part { display: grid; grid-template-columns: 1fr; gap: 6px; border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 10px; padding: 8px 10px; position: relative; }

.lt-part select { width: 100%; }
.lt-add button { min-height: 36px; padding: 4px 10px; font-size: 14px; }
.lt-lens { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; }
.lt-lens small { font-size: 12px; }
.check { display: flex; align-items: center; gap: 6px; }
.check input { width: 22px; height: 22px; min-height: 0; }

.lt-legend { margin-top: 10px; font-size: 14px; line-height: 1.5; }
.lt-legend b { color: var(--orange); }

.lt-checks { display: flex; flex-direction: column; gap: 4px; }
.lt-chk { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; background: var(--bg); font-size: 14.5px; }

.p-page .lt-tbl { margin-top: 6px; font-size: 8.5pt; }

.p-sign { display: flex; justify-content: space-between; align-items: center; border-top: 1.5px solid #000; margin-top: 8px; padding-top: 4px; }
.p-sign img { max-height: 16mm; }
.p-sign span { margin-left: 14px; }
.p-empty { border: 1px dashed #999; padding: 30mm 0; text-align: center; color: #888; }

    else if (p.lock && Number(p.length_m) > 0) L = Number(p.length_m);
    else if (p.item?.length_m) L = Number(p.item.length_m);
    else L = roundSlingLength(need, roundMode, stdLengths(p.item));
    p.length_m = L;
    leg.slingLength = L;
  }
  leg.wrap = wrap;
  leg.Leff = leg.slingLength + leg.hwLength - wrap;
}

/** Length of the length element for Lreq without changing the leg (dry run of sizeLengthElement). */
function trialLeff(leg, Lreq, roundMode) {
  const p = leg.parts[leg.li];
  if (!p?.item) return null;
  if (leg.imposed > 0) return leg.imposed;
  const wrap = p.hitch === 'choke' ? Math.max(0, Number(p.wrap_m) || 0) : 0;
  const need = Lreq - leg.hwLength + wrap;
  let L;
  if (p.kind === 'chain') L = chainLinks(p.item, need, roundMode === 'exact' ? 'nearest' : 'up').length_m;
  else if (p.lock && Number(p.length_m) > 0) L = Number(p.length_m);
  else if (p.item?.length_m) L = Number(p.item.length_m);
  else L = roundSlingLength(need, roundMode, stdLengths(p.item));
  return L + leg.hwLength - wrap;
}

/**
 * Hook height used to choose the standard lengths: the one (at or above the design height, legs not
 * steeper than the target angle) for which the rounded lengths of the legs agree best, so that the
 * load hangs level. Returns zDesign when nothing better is found.
 */
function bestSizingHeight(legs, cog, zDesign, roundMode, angleMaxDeg) {
  if (!legs.length || legs.some((l) => !l.parts[l.li]?.item)) return zDesign;
  let best = null;
  for (let dz = 0; dz <= 1.5 + 1e-9; dz += 0.01) {
    const z = zDesign + dz;
    const top = v3(cog.x, cog.y, z);
    const zl = [];
    let ok = true;
    for (const leg of legs) {
      const Le = trialLeff(leg, vlen(vsub(top, leg.bottom)), roundMode);
      const d = hdist(cog, leg.bottom);
      if (Le == null || Le <= d) { ok = false; break; }
      zl.push(leg.bottom.z + Math.sqrt(Le * Le - d * d));
    }
    if (!ok) continue;
    const zh = mean(zl);
    const ang = Math.max(...legs.map((l) => deg(Math.atan2(hdist(cog, l.bottom), zh - l.bottom.z))));
    if (ang > angleMaxDeg + 0.25) continue;
    const spread = Math.max(...zl) - Math.min(...zl);
    const score = spread + 0.01 * dz;
    if (!best || score < best.score - 1e-9) best = { z, score };
  }
  return best ? best.z : zDesign;
}

/** "Matched set" mode: one standard sling length (rounded up from the longest requirement) for a group. */
function applyLengthSet(legs, roundMode) {
  if (roundMode !== 'set') return;
  const isSling = (l) => { const p = l.parts[l.li]; return p && p.kind === 'sling' && !(p.lock && Number(p.length_m) > 0) && !p.item?.length_m; };
  // imposed leg lengths: one standard length for the set, the nearest to their mean
  const imp = legs.filter((l) => isSling(l) && l.imposed > 0);
  if (imp.length) {
    const Li = standardLength(imp.reduce((t, l) => t + l.slingLengthReq, 0) / imp.length, stdLengths(imp[0].parts[imp[0].li].item), false);
    imp.forEach((l) => {
      l.parts[l.li].length_m = Li;
      l.slingLength = Li;
      l.Leff = Li + l.hwLength - (l.wrap || 0);
    });
  }
  const free = legs.filter((l) => isSling(l) && !(l.imposed > 0));
  if (!free.length) return;
  const maxReq = Math.max(...free.map((l) => l.slingLengthReq));
  const L = standardLength(maxReq, stdLengths(free[0].parts[free[0].li].item), true);
  free.forEach((l) => {
    l.parts[l.li].length_m = L;
    l.slingLength = L;
    l.Leff = L + l.hwLength - (l.wrap || 0);
  });
}

function legWeight(leg) {
  return leg.parts.reduce((s, p) => s + itemWeight_t(p.item, isLengthPart(p) ? p.length_m : 0), 0);
}

/** Compatibility aliases used by the drawings, the BOM and older code. */
function aliasComps(leg) {
  const parts = leg.parts;
  const len = parts[leg.li];
  leg.comps = {
    sling: len?.kind === 'sling' ? len.item : null,
    chain: len?.kind === 'chain' ? len.item : null,
    lengthItem: len?.item || null,
    bottomShackle: parts[0]?.kind === 'shackle' ? parts[0].item : null,
    topConn: leg.li >= 0 && parts.length - 1 > leg.li ? parts[parts.length - 1].item : null,
  };
  leg.lengthKind = len?.kind || null;
  leg.hitch = len?.hitch || 'direct';
  leg.cfg = { mode: leg.hitch };
}

function headConfig(rig) {
  const h = rig.head || {};
  const ml = rig.masterlink || {};
  const type = h.type || (rig.headType === 'hook' ? 'hook' : ml.subLinks ? 'assembly' : 'masterlink');
  return {
    type,
    itemId: h.itemId ?? ml.itemId ?? 'auto',
    subLinkItemId: h.subLinkItemId ?? ml.subLinkItemId ?? 'auto',
    topShackle: false,
    topShackleId: 'auto',
    unknownSWL: !!h.unknownSWL,
  };
}

/** Master link (+ optional sub-links) and top shackle. */
function pickHead(rig, legs, Fvert, rules) {
  const hc = headConfig(rig);
  const nLegs = legs.length;
  const useSub = hc.type === 'assembly' && nLegs >= 3;
  let pairs = null;
  let subLink = null;
  let fitWidth = 0;
  let masterlink = null;
  // space taken along the bottom bar of the master link by the last part of each leg
  const widthOf = (leg) => alongWidth(leg);
  const topShackle = hc.topShackle ? (isAuto(hc.topShackleId) ? selectShackle(Fvert, {}, rules) : getItem(hc.topShackleId)) : null;
  if (hc.type === 'hook') {
    return {
      type: 'hook', masterlink: null, subLink: null, pairs: null, useSub: false, topShackle: null, onHook: true,
      headLen: 0, subLen: 0, fitWidth: legs.reduce((s, l) => s + widthOf(l), 0), weight: 0,
    };
  }
  let integrated = false;
  let pairWidth = 0;
  if (useSub) {
    const sorted = [...legs].sort((a, b) => a.azimuth - b.azimuth);
    pairs = [];
    for (let i = 0; i < sorted.length; i += 2) pairs.push(sorted.slice(i, i + 2));
    const pairLoad = Math.max(...pairs.map((p) => p.reduce((s, l) => s + l.Fdesign * Math.cos(rad(l.angleV)), 0)));
    pairWidth = Math.max(...pairs.map((p) => p.reduce((s, l) => s + widthOf(l), 0)));
    const chosen = isAuto(hc.itemId) ? null : getItem(hc.itemId);
    const asm = chosen?.sub ? chosen : isAuto(hc.itemId) ? selectMasterlink(Fvert, 0, 2, { assembly: true, subWidth: pairWidth }) : null;
    if (asm?.sub) {
      masterlink = asm;
      integrated = true;
      subLink = {
        id: `${asm.id}#sub`, type: 'masterlink', name: `${asm.short || asm.name} — sub-link`, short: `${asm.short || asm.name} sub-link`,
        wll_t: asm.wll_t, weight_kg: 0, integrated: true,
        dims: { stockDia: asm.sub.stockDia, insideLength: asm.sub.insideLength, insideWidth: asm.sub.insideWidth },
      };
    } else {
      subLink = isAuto(hc.subLinkItemId) ? selectMasterlink(pairLoad, pairWidth, 2, { assembly: false }) : getItem(hc.subLinkItemId);
      fitWidth = pairs.length * (subLink?.dims?.stockDia || 0);
    }
  } else {
    fitWidth = legs.reduce((s, l) => s + widthOf(l), 0);
  }
  if (!masterlink) masterlink = isAuto(hc.itemId) ? selectMasterlink(Fvert, fitWidth, 2, { assembly: false }) : getItem(hc.itemId);
  const headLen = connectorLength(masterlink) + connectorLength(topShackle, 'link');
  const subLen = useSub ? connectorLength(subLink) : 0;
  const weight = itemWeight_t(masterlink) + itemWeight_t(topShackle) + (useSub && !integrated ? (pairs?.length || 0) * itemWeight_t(subLink) : 0);
  return { type: hc.type, masterlink, subLink, pairs, useSub, integrated, topShackle, headLen, subLen, fitWidth, pairWidth, weight: hc.unknownSWL ? 0 : weight, unknownSWL: hc.unknownSWL };
}

/** Hook-side shackles pinned on the master link / sub-link: the link bar must fit in the jaw. */
function fitHeadShackles(legs, head, rules) {
  if (!head || head.onHook) return;
  legs.forEach((leg) => {
    const n = leg.parts.length - 1;
    const p = leg.parts[n];
    if (!p || p.kind !== 'shackle' || !isAuto(p.id) || n < leg.li) return;
    const link = head.useSub && head.subLink && leg.level === 'main' ? head.subLink : head.masterlink;
    const bar = link?.dims?.stockDia || 0;
    if (bar && p.item && p.item.dims.jawWidth < bar) {
      const up = selectShackle(p.reqWll || leg.Fsel, { minJaw: bar }, rules);
      if (up) p.item = up;
      aliasComps(leg);
    }
  });
}

/** Result of a converging leg (final geometry + forces). */
function finalizeLeg(leg, top, tens, i, fac, zLegTop) {
  const p = leg.bottom;
  const d = hdist(top, p);
  const h = top.z - p.z;
  const L = vlen(vsub(top, p));
  const u = vnorm(vsub(top, p));
  leg.top = top;
  leg.d = d;
  leg.h = h;
  leg.Lgeom = L;
  leg.angleH = deg(Math.atan2(h, d));
  leg.angleV = 90 - leg.angleH;
  leg.azimuth = deg(Math.atan2(p.y - top.y, p.x - top.x));
  leg.u = u;
  leg.beta = outOfPlaneAngle(u, leg.azimuthPad);
  leg.Tstatic = tens.T[i];
  leg.Tnom = tens.Tnom[i];
  leg.R = tens.R[i];
  leg.Rmin = tens.Rmin[i];
  leg.Fdesign = leg.Tstatic * fac;
  leg.mismatch_mm = zLegTop != null ? (zLegTop - top.z) * 1000 : 0;
  return leg;
}

/**
 * Slings and shackles sized for at least the sizing angle to the vertical (e.g. 30°): the design
 * force of a leg is its vertical share / cos(max(actual angle, sizing angle)) × factors.
 */
function applySizingAngle(legs, design, fac) {
  const sa = Number(design?.sizingAngleV_deg);
  if (!(sa > 0 && sa < 89)) return;
  legs.forEach((l) => {
    const a = Math.max(l.angleV, sa);
    const T = ((l.Tstatic * Math.cos(rad(l.angleV))) / Math.cos(rad(a))) * fac;
    l.FdesignActual = l.Fdesign;
    if (T > l.Fdesign + 1e-9) { l.Fdesign = T; l.sizedAt = a; }
  });
}

/** True when an automatically selected part is no longer sufficient for the final force. */
function needsReselect(leg) {
  const F = leg.Fdesign;
  return leg.parts.some((p, i) => {
    if (!isAuto(p.id) || !p.item) return false;
    let f = p.factor || 1;
    if (i === 0 && p.kind === 'shackle' && leg.level !== 'top') f = shackleSideLoadFactor(leg.beta || 0);
    return p.item.wll_t * f < F - 1e-9;
  });
}

/** Design force used for selection: uniform sizing (max of the group) unless disabled. */
function selectionForces(F, design) {
  if (design?.uniformLegs === false) return F;
  const m = Math.max(...F);
  return F.map(() => m);
}

/** EN 13414 / EN 818-4 / EN 1492: minimum leg WLL so that K × leg WLL ≥ load. */
function enMinLegWll(load, n, betaDeg, rules) {
  if (rules?.enCheck === false || rules?.enSizing === false) return 0;
  const K = enModeFactor(n, betaDeg);
  return K ? load / K : 0;
}

const designAngleV = (design) => {
  if (Number(design?.targetAngleV_deg) > 0) return Number(design.targetAngleV_deg);
  if (Number(design?.targetAngle_deg) > 0) return 90 - Number(design.targetAngle_deg); // v2 (angle to horizontal)
  return 30;
};

// ---------------------------------------------------------------------------
// Configuration 1: direct hook (1 to n converging legs)
function solveHook(project, ctx) {
  const { pts, W, cog, fac, rules } = ctx;
  const rig = project.rigging;
  const design = rig.design || {};
  const roundMode = design.roundLengths || 'nearest';
  const env = project.load.cogEnvelope_mm;
  const n = pts.length;
  const zPadMax = Math.max(...pts.map((p) => p.pos.z));

  // 1) design geometry: target angle to the vertical, or imposed hook height
  let zDesign;
  if (design.mode === 'height' && Number(design.hookHeight_m) > 0) zDesign = zPadMax + Number(design.hookHeight_m);
  else {
    const a = rad(Math.min(85, Math.max(1, designAngleV(design))));
    zDesign = Math.max(...pts.map((p) => p.pos.z + hdist(cog, p.pos) / Math.tan(a)));
    if (n === 1 || zDesign - zPadMax < 0.3) zDesign = Math.max(zDesign, zPadMax + (Number(design.minHeight_m) || 1.0));
  }
  let tD = envelopeTensions(zDesign, pts.map((p) => p.pos), W, cog, env);
  const topD = v3(cog.x, cog.y, zDesign);
  if (rig.equalShare) tD = shareEqually(tD, topD, pts.map((p) => p.pos));

  const betaD = Math.max(...pts.map((p) => deg(Math.acos(Math.min(1, vnorm(vsub(topD, p.pos)).z)))));
  const build = (Fmin = []) => {
    // 2) equipment selection per leg (uniform sizing of the set by default)
    const Fsel = selectionForces(pts.map((_, i) => Math.max(tD.T[i] * fac, Fmin[i] || 0)), design);
    const Flen = enMinLegWll(W, n, betaD, rules);
    let legs = pts.map((p, i) => {
      const u = vnorm(vsub(topD, p.pos));
      const beta = outOfPlaneAngle(u, p.azimuth_deg);
      const F = Fsel[i];
      const r = resolveParts(legAssembly(rig, p.id, 'main'), F, { point: p, beta, rules, level: 'main', Flen });
      const leg = {
        key: p.id, label: `Leg ${p.id}`, level: 'main', pointId: p.id, point: p, bottom: p.pos, azimuthPad: p.azimuth_deg,
        parts: r.parts, li: r.li, errors: r.errors, Fsel: F, Fdesign: tD.T[i] * fac, Flen,
        angleV: deg(Math.acos(Math.min(1, u.z))), azimuth: deg(Math.atan2(p.pos.y - cog.y, p.pos.x - cog.x)),
        imposed: Number(rig.legs?.[p.id]?.Leff_m) > 0 ? Number(rig.legs[p.id].Leff_m) : null,
      };
      aliasComps(leg);
      return leg;
    });
    const head = pickHead(rig, legs, W * ctx.facHead, rules);
    fitHeadShackles(legs, head, rules);
    // 3) lengths: every leg with its own hardware; standard lengths chosen so that the legs agree
    legs.forEach((leg) => {
      leg.hwLength = connectorsLength(leg.parts) + head.headLen + (head.useSub ? head.subLen : 0);
    });
    const zSize = (roundMode === 'nearest' || roundMode === 'up') && design.mode !== 'height' ? bestSizingHeight(legs, cog, zDesign, roundMode, designAngleV(design)) : zDesign;
    const topS = v3(cog.x, cog.y, zSize);
    legs.forEach((leg) => sizeLengthElement(leg, vlen(vsub(topS, leg.bottom)), roundMode));
    applyLengthSet(legs, roundMode);
    // 4) actual geometry: hook height given by each leg
    const zLeg = legs.map((leg) => {
      const d = hdist(cog, leg.bottom);
      return leg.Leff > d ? leg.bottom.z + Math.sqrt(leg.Leff ** 2 - d ** 2) : null;
    });
    const tooShort = legs.filter((_, i) => zLeg[i] == null).map((l) => l.key);
    const valid = zLeg.filter((z) => z != null);
    const zHook = valid.length ? mean(valid) : zDesign;
    const hook = v3(cog.x, cog.y, zHook);
    let tA = envelopeTensions(zHook, pts.map((p) => p.pos), W, cog, env);
    if (rig.equalShare) tA = shareEqually(tA, hook, pts.map((p) => p.pos));
    legs = legs.map((leg, i) => finalizeLeg(leg, hook, tA, i, fac, zLeg[i]));
    applySizingAngle(legs, design, fac);
    return { legs, head, hook, tooShort, zHook };
  };

  let b = build();
  // re-select once with the final forces if an automatic part became insufficient
  if (b.legs.some(needsReselect)) b = build(b.legs.map((l) => l.Fdesign * 1.0001));
  const { legs, head, hook, tooShort, zHook } = b;

  const rigWeight = legs.reduce((s, l) => s + legWeight(l), 0) + head.weight;
  const tilt = tooShort.length ? null : estimateTilt(legs.map((l) => l.bottom), cog, legs.map((l) => l.Leff));
  return {
    type: 'hook', hook, legs, head, tooShort, zDesign, rigWeight, tilt,
    Fvert_design: (W + rigWeight - head.weight) * ctx.facHead,
    riggingHeight: zHook - zPadMax,
    spreader: null,
  };
}

// ---------------------------------------------------------------------------
// Configuration 2: spreader bar — 2 top legs, 1 or 2 bottom legs per bar end
function solveSpreader(project, ctx) {
  const { pts, W, cog, fac, rules } = ctx;
  const rig = project.rigging;
  const sp = rig.spreader || {};
  const design = rig.design || {};
  const roundMode = design.roundLengths || 'nearest';
  const env = project.load.cogEnvelope_mm;
  const axis = sp.axis === 'y' ? 'y' : 'x';
  const other = axis === 'x' ? 'y' : 'x';
  const Lbar = Number(sp.length_m) || 0;
  const depth = Number(sp.depth_m) || 0.3;
  const Wbar = Number(sp.weight_t) || 0;

  const groupA = pts.filter((p) => p.pos[axis] < cog[axis]);
  const groupB = pts.filter((p) => p.pos[axis] >= cog[axis]);
  const errors = [];
  if (!groupA.length || !groupB.length) errors.push('All lift points are on the same side of the COG along the spreader axis');
  if (!(Lbar > 0)) errors.push('Spreader bar lug spacing not entered');

  const cA = groupA.length ? mean(groupA.map((p) => p.pos[axis])) : cog[axis] - Lbar / 2;
  const cB = groupB.length ? mean(groupB.map((p) => p.pos[axis])) : cog[axis] + Lbar / 2;
  const center = sp.position === 'cog' ? cog[axis] : (cA + cB) / 2;
  const L = Lbar > 0 ? Lbar : Math.abs(cB - cA);
  const mk = (a) => (axis === 'x' ? v3(a, cog.y, 0) : v3(cog.x, a, 0));
  const lugA = mk(center - L / 2);
  const lugB = mk(center + L / 2);
  const groupOf = (p) => (p.pos[axis] < cog[axis] ? 'A' : 'B');

  // ---- bottom legs: design
  const aBot = rad(Math.min(85, Math.max(1, Number(sp.bottomTargetAngleV_deg) || (Number(sp.bottomTargetAngle_deg) ? 90 - Number(sp.bottomTargetAngle_deg) : 30))));
  const hMin = Number(sp.minBottomHeight_m) || 1.0;
  const zPadMax = Math.max(...pts.map((p) => p.pos.z));
  const zBotDesign = Math.max(
    ...pts.map((p) => {
      const lug = groupOf(p) === 'A' ? lugA : lugB;
      const d = hdist(lug, p.pos);
      return p.pos.z + Math.max(d / Math.tan(aBot), hMin);
    }),
  );
  const ptsPos = pts.map((p) => p.pos);
  const tBotD = envelopeReactions(ptsPos, W, cog, env);
  const Rd = tBotD.Rmax;

  const topLugCtx = { holeDia: Number(sp.topLugHoleDia_mm) || 0, padeyeThk: Number(sp.topLugThk_mm) || 0 };
  const botLugCtx = { holeDia: Number(sp.bottomLugHoleDia_mm) || 0, padeyeThk: Number(sp.bottomLugThk_mm) || 0 };

  const Fbot = selectionForces(
    pts.map((p, i) => {
      const lug = groupOf(p) === 'A' ? lugA : lugB;
      const u = vnorm(vsub(v3(lug.x, lug.y, zBotDesign), p.pos));
      return (u.z > 1e-6 ? Rd[i] / u.z : Infinity) * fac;
    }),
    design,
  );
  let bottomLegs = pts.map((p, i) => {
    const g = groupOf(p);
    const lug = g === 'A' ? lugA : lugB;
    const topPt = v3(lug.x, lug.y, zBotDesign);
    const u = vnorm(vsub(topPt, p.pos));
    const F = Fbot[i];
    const beta = outOfPlaneAngle(u, p.azimuth_deg);
    const r = resolveParts(legAssembly(rig, p.id, 'main'), F, { point: p, beta, rules, level: 'bottom', bottomLug: botLugCtx });
    const leg = {
      key: p.id, label: `Bottom ${p.id}`, level: 'bottom', group: g, pointId: p.id, point: p, bottom: p.pos, azimuthPad: p.azimuth_deg,
      parts: r.parts, li: r.li, errors: r.errors, Fsel: F, lug,
    };
    aliasComps(leg);
    leg.hwLength = connectorsLength(leg.parts);
    sizeLengthElement(leg, vlen(vsub(topPt, p.pos)), roundMode);
    return leg;
  });
  applyLengthSet(bottomLegs, roundMode);

  // ---- actual bottom geometry → spreader elevation
  const zBotLeg = bottomLegs.map((leg) => {
    const d = hdist(leg.lug, leg.bottom);
    return leg.Leff > d ? leg.bottom.z + Math.sqrt(leg.Leff ** 2 - d ** 2) : null;
  });
  const tooShort = bottomLegs.filter((_, i) => zBotLeg[i] == null).map((l) => l.key);
  const zBot = mean(zBotLeg.filter((z) => z != null)) || zBotDesign;
  const R = tBotD.R;
  const RminAll = tBotD.Rmin;
  const Rmax = Rd;
  bottomLegs = bottomLegs.map((leg, i) => {
    const top = v3(leg.lug.x, leg.lug.y, zBot);
    const u = vnorm(vsub(top, leg.bottom));
    const tens = { T: [], Tnom: [], R: [], Rmin: [] };
    tens.T[i] = u.z > 1e-6 ? Rmax[i] / u.z : Infinity;
    tens.Tnom[i] = u.z > 1e-6 ? R[i] / u.z : Infinity;
    tens.R[i] = R[i];
    tens.Rmin[i] = RminAll[i];
    return finalizeLeg(leg, top, tens, i, fac, zBotLeg[i]);
  });

  // ---- loads at the spreader ends
  const botRigW = bottomLegs.reduce((s, l) => s + legWeight(l), 0);
  const end = { A: { V: 0, Vmax: 0, Hx: 0, Hy: 0 }, B: { V: 0, Vmax: 0, Hx: 0, Hy: 0 } };
  bottomLegs.forEach((l, i) => {
    end[l.group].V += R[i];
    end[l.group].Vmax += Rmax[i];
    end[l.group].Hx += -l.Tnom * l.u.x;
    end[l.group].Hy += -l.Tnom * l.u.y;
  });
  const VA = end.A.V + Wbar / 2 + botRigW / 2;
  const VB = end.B.V + Wbar / 2 + botRigW / 2;
  const VAm = end.A.Vmax + Wbar / 2 + botRigW / 2;
  const VBm = end.B.Vmax + Wbar / 2 + botRigW / 2;
  const zTopLug = zBot + depth;
  const hookPlanA = (VA * lugA[axis] + VB * lugB[axis]) / Math.max(VA + VB, 1e-9);
  const hookPlan = axis === 'x' ? v3(hookPlanA, cog.y, 0) : v3(cog.x, hookPlanA, 0);

  // ---- top legs: design
  const aTop = rad(Math.min(85, Math.max(1, designAngleV(design))));
  const dA = Math.abs(hookPlan[axis] - lugA[axis]);

  if (!st.photos.length) { wrap.append(el('p', { class: 'muted' }, 'Add a photo first (step 1).')); return wrap; }
  const ph = st.photos.find((p) => p.id === st.sketch) || st.photos[0];
  st.sketch = ph.id;
  ph.tops = ph.tops || {};
  wrap.append(el('div', { class: 'lt-thumbs' }, st.photos.map((p) => el('button', { class: `lt-thumb ${p.id === ph.id ? 'on' : ''}`, onclick: () => { st.sketch = p.id; changed(true); } }, el('img', { src: safeImg(p.img) || '', alt: '' }), el('span', {}, p.name)))));
  const view = photoView(ph, {
    legs: true,
    onTap: (q) => { if (!ph.hook) { ph.hook = q; changed(true); } },
    onDrag: (m, q) => { if (m === 'hook') ph.hook = q; else ph.tops[m.slice(2)] = q; redrawMarks(view, ph, true); },
  });
  const missing = legIds(st).filter((_, i) => !ph.points[i + 1]);
  wrap.append(
    el('p', { class: 'muted small' }, ph.hook ? 'Drag the hook, or the round handle of a leg to make it longer or shorter on the sketch.' : 'Tap where the crane hook is: the legs are drawn from the lift points to it.'),
    view,
    missing.length ? el('p', { class: 'note warn small' }, `Points not placed on this photo: ${missing.map((id) => `${legIds(st).indexOf(id) + 1} (${id})`).join(', ')} — place them in step 1.`) : '',
    el('div', { class: 'lt-row' },
      el('button', { onclick: () => { ph.hook = null; ph.tops = {}; changed(true); } }, 'Place the hook again'),
      el('button', { onclick: () => { ph.tops = {}; changed(true); } }, 'Legs back to the hook')),
    legend());
  return wrap;
}

/** What each leg is made of (identical legs grouped). */
function legend() {
  const groups = [];
  out.legs.forEach((l) => {
    const t = (l.parts || []).filter((x) => x.item).map((x) => niceName(x.item, isLengthPart(x) ? { length_m: x.length_m, links: x.kind === 'chain' ? x.links : null } : {})).join(' → ');
    const g = groups.find((x) => x.t === t);
    if (g) g.ids.push(l.pointId); else groups.push({ ids: [l.pointId], t });
  });
  const h = out.rig?.head;
  return el('div', { class: 'lt-legend' },
    groups.map((g) => el('div', {}, el('b', {}, `${g.ids.join(', ')}:`), ` ${g.t}`)),
    st.head !== 'hook' ? el('div', {}, el('b', {}, 'Hook:'), ` ${st.head === 'crane' ? 'master link of the crane' : h?.masterlink ? niceName(h.masterlink) : 'master link'}`) : null);
}

// ------------------------------------------------------------------ 5. plan
function checkList(all = false) {
  const bad = out.checks.filter((c) => c.status === 'fail' || c.status === 'warn');
  const shown = all ? out.checks : bad;
  return el('div', { class: 'lt-checks' },
    !out.checks.length ? el('p', { class: 'muted' }, 'Give the weight and the lengths of the legs.') : null,
    shown.map((c) => el('div', { class: `lt-chk ${c.status}` }, el('b', {}, { ok: '✓', warn: '!', fail: '✕', info: 'i' }[c.status] || '•'), el('span', {}, `${c.item}: ${c.label}${c.util != null ? ` — ${Math.round(c.util * 100)} %` : ''}`))),
    !all && !bad.length && out.checks.length ? el('div', { class: 'lt-chk ok' }, el('b', {}, '✓'), el('span', {}, `All ${out.checks.length} checks OK (SWL of every part, parts compatible, crane)`)) : null);
}

function stepPlan() {
  const sigImg = safeImg(st.signature);
  return el('div', {},
    el('section', { class: 'lt-card' }, el('h2', {}, 'Checks'), checkList(),
      el('details', {}, el('summary', {}, 'All the checks'), checkList(true))),
    el('section', { class: 'lt-card' }, el('h2', {}, 'Equipment'), equipmentTable()),
    el('section', { class: 'lt-card' }, el('h2', {}, 'Prepared by'),
      el('div', { class: 'lt-2' },
        field('Name', st.preparedBy, (v) => { st.preparedBy = v; }, { type: 'text', ph: 'Name' }),
        field('Date', st.date, (v) => { st.date = v; }, { type: 'date' })),
      el('div', { class: 'lt-sig' }, sigImg ? el('img', { src: sigImg, alt: '' }) : el('span', { class: 'muted' }, 'No signature')),
      el('div', { class: 'lt-row' },
        el('button', { onclick: () => { const u = signatureFromName(st.preparedBy); if (!u) return toast('Type the name first'); st.signature = u; changed(true); } }, '✍ From the name'),
        el('button', { onclick: () => openSignPad('Prepared by', (u) => { st.signature = u; changed(true); }, st.preparedBy) }, '✎ Draw'),
        sigImg ? el('button', { class: 'danger', onclick: () => { st.signature = null; changed(true); } }, 'Remove') : null)));
}

function equipmentTable() {
  return el('table', { class: 'lt-tbl' },
    el('thead', {}, el('tr', {}, ['Qty', 'Item', 'Length', 'SWL', 'Legs'].map((h) => el('th', {}, h)))),
    el('tbody', {}, out.bom.map((b) => el('tr', {},
      el('td', {}, String(b.qty)), el('td', {}, b.name),
      el('td', { class: 'nw' }, b.ewl_m != null ? `${fmt(b.ewl_m)} m${b.links ? ` (${b.links} links)` : ''}` : '—'),
      el('td', { class: 'nw' }, b.wll_t != null ? `${fmt(b.wll_t)} t` : '—'),
      el('td', {}, b.config || '')))));
}

// ------------------------------------------------------------------ PDF (one page)
function printPlan() {
  const pr = document.getElementById('lt-print');
  pr.innerHTML = '';
  const sk = st.photos.find((p) => p.id === st.sketch) || st.photos[0];
  const others = st.photos.filter((p) => p !== sk);
  const fig = (ph, legs) => { const i = el('div', { class: 'p-img' }, el('img', { src: safeImg(ph.img) || '', alt: '' })); i.insertAdjacentHTML('beforeend', marksSvg(ph, { legs })); return el('div', { class: 'p-fig' }, i, el('div', { class: 'p-cap' }, ph.name)); };
  const kv = (k, v) => el('tr', {}, el('th', {}, k), el('td', {}, v ?? '—'));
  const c = st.crane;
  const bad = out.checks.filter((x) => x.status === 'fail' || x.status === 'warn');
  const sigImg = safeImg(st.signature);
  pr.append(el('div', { class: 'p-page' },
    el('div', { class: 'p-head' }, el('div', {}, el('h1', {}, 'LIFT PLAN'), el('div', {}, [st.title, st.location].filter(Boolean).join(' — ') || '—')), el('div', { class: 'p-date' }, st.date || '')),
    el('div', { class: 'p-sketch' }, sk ? fig(sk, true) : el('div', { class: 'p-empty' }, 'No photo')),
    el('div', { class: 'p-top' },
      el('table', { class: 'p-kv' },
        kv('Weight', st.weight_t ? `${fmt(st.weight_t)} t` : null), kv('Factor', `× ${fmt(st.factor, 2)}`),
        kv('Rigging', out.rigW ? `${fmt(out.rigW)} t` : null), kv('Hook load × factor', out.hook ? `${fmt(out.hook)} t` : null),
        kv('Legs', `${legIds(st).length} at ${ANGLE}° (sizing)`), kv('Force per leg', out.legs[0] ? `${fmt(out.legs[0].Fdesign)} t` : null),
        kv('Crane', c.name || null),
        kv('SWL min. radius', c.swlMin_t ? `${fmt(c.swlMin_t)} t${c.rMin_m ? ` at ${c.rMin_m} m` : ''}` : null),
        kv('SWL max. radius', c.swlMax_t ? `${fmt(c.swlMax_t)} t${c.rMax_m ? ` at ${c.rMax_m} m` : ''}` : null)),
      el('div', { class: 'p-side' },
        legend(),
        el('div', { class: `p-res ${out.status}` }, out.status === 'ok' ? `✓ All ${out.checks.length} checks OK — SWL of every part, parts compatible, crane` : `${bad.length} point(s) to resolve`),
        bad.length ? el('ul', { class: 'p-bad' }, bad.slice(0, 8).map((x) => el('li', {}, `${x.item}: ${x.label}`))) : null)),
    others.length ? el('div', { class: 'p-others' }, others.slice(0, 3).map((p) => fig(p, false))) : null,
    equipmentTable(),
    el('div', { class: 'p-sign' }, el('div', {}, el('b', {}, 'Prepared by: '), st.preparedBy || '—', el('span', {}, `   Date: ${st.date || ''}`)), sigImg ? el('img', { src: sigImg, alt: '' }) : null)));
  // one A4 page: measured at the printed width, scaled down when too tall
  const imgs = [...pr.querySelectorAll('img')];
  Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.onload = r; i.onerror = r; })))).then(() => {
    const pg = pr.firstChild;
    pg.style.zoom = '';
    Object.assign(pr.style, { display: 'block', position: 'absolute', left: '-10000px', top: '0', width: '190mm' });
    const mm = pr.getBoundingClientRect().width / 190;
    const h = pg.getBoundingClientRect().height / mm;
    pr.removeAttribute('style');
    if (h > 274) pg.style.zoom = String(Math.floor((274 / h) * 100) / 100);
    setTimeout(() => window.print(), 50);
  });
}

// ------------------------------------------------------------------ file
function saveFile() {
  const blob = new Blob([JSON.stringify(st)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: `${(st.title || 'lift-plan').replace(/[^\w-]+/g, '_')}.liftlight.json` });
  document.body.append(a);
  a.click();
  a.remove();
}
function openFile(e) {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (s.v !== 1) throw new Error('not a LiftPlanner Light file');
      st = { ...newState(), ...s };
      cur = st.photos[0]?.id || null;
      changed();
      go('photos');
    } catch (err) { alert(`Unreadable file: ${err.message}`); }
  };
  r.readAsText(f);
}

// published page: offer to reload when a new version is online
function checkUpdate() {
  const b = document.querySelector('meta[name="build"]')?.content;
  if (!b || location.protocol === 'file:') return;
  fetch('version.json', { cache: 'no-store' }).then((r) => r.json()).then((v) => {
    if (!v.build || v.build === b || document.getElementById('lt-update')) return;
    document.body.append(el('div', { id: 'lt-update', class: 'lt-update no-print' }, `New version ${v.version || ''} available`,
      el('button', { onclick: () => location.reload() }, 'Reload')));
  }).catch(() => {});
}

shell();
render();
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k !== step && STEPS.some(([x]) => x === k)) go(k); });
setTimeout(checkUpdate, 10000);
setInterval(checkUpdate, 180000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

return {  };
})();
</script>
</body>
