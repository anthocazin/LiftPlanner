name: Publish to GitHub Pages

# Publishes the application on GitHub Pages on every push to main.
# Enable: Settings → Pages → Source = "GitHub Actions".
# Pages on a private repository requires a paid GitHub plan (Pro / Team / Enterprise).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Prepare the site
        # The code goes under a folder named after the commit (v/<sha>/): each version has new URLs,
        # so a browser never mixes cached modules of an older version. version.json lets an open
        # page offer to reload when a newer version is published.
        run: |
          SHA="${GITHUB_SHA::8}"
          mkdir -p "_site/v/$SHA"
          cp -r css js vendor "_site/v/$SHA/"
          cp -r examples dist _site/
          sed -e "s#href=\"css/app.css\"#href=\"v/$SHA/css/app.css\"#" \
              -e "s#src=\"js/ui/main.js\"#src=\"v/$SHA/js/ui/main.js\"#" \
              -e "s#</head>#  <meta name=\"build\" content=\"$SHA\" />\n</head>#" index.html > _site/index.html
          echo "{\"build\":\"$SHA\"}" > _site/version.json
          grep -q "v/$SHA/js/ui/main.js" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
