name: Publish to GitHub Pages

# Publishes the application on GitHub Pages on every push to main.
# Enable: Settings → Pages → Source = "GitHub Actions".
# Pages on a private repository requires a paid GitHub plan (Pro / Team / Enterprise).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp -r index.html css js vendor examples dist _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
